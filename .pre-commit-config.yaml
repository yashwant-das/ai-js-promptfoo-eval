minimum_pre_commit_version: '4.7.0'
exclude: ^(node_modules/|outputs/|\.promptfoo/|\.superpowers/|docs/superpowers/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
      - id: check-json
        types: [json]
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: node_modules/.bin/eslint
        language: system
        types: [javascript]
      - id: prettier
        name: Prettier check
        entry: node_modules/.bin/prettier --check
        language: system
        files: \.(js|json|jsonc)$
        exclude: ^package-lock\.json$
      - id: markdownlint
        name: Markdown lint
        entry: node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]
