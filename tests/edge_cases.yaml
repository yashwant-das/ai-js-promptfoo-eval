- vars:
    language: French
    input: What's up?
  assert:
    - type: contains
      value: Quoi

- vars:
    language: Spanish
    input: What's up?
  assert:
    - type: contains
      value: Qué

- vars:
    language: French
    input: It's raining cats and dogs
  assert:
    - type: icontains-any
      value: ["il pleut", "battre"]

- vars:
    language: Spanish
    input: It's raining cats and dogs
  assert:
    - type: icontains-any
      value: ["llov", "lluev", "cántaros", "gato"]

- vars:
    language: German
    input: Don't cross the bridge until you come to it
  assert:
    - type: icontains-any
      value: ["Brücke", "Sorge", "Kommt Zeit"]

- vars:
    language: French
    input: I am hungry
  assert:
    - type: contains
      value: faim

- vars:
    language: Spanish
    input: I am hungry
  assert:
    - type: contains
      value: hambre

- vars:
    language: German
    input: I am hungry
  assert:
    - type: icontains-any
      value: ["hungrig", "Hunger"]

- vars:
    language: French
    input: "Hello! How are you today? :-)"
  assert:
    - type: icontains-any
      value: ["Bonjour", "Salut"]

- vars:
    language: Spanish
    input: "Hello! How are you today? :-)"
  assert:
    - type: icontains-any
      value: ["Hola", "¿Cómo estás"]

- vars:
    language: German
    input: "Hello! How are you today? :-)"
  assert:
    - type: icontains-any
      value: ["Hallo", "Wie geht"]

- vars:
    language: French
    input: The quick brown fox jumps over the lazy dog
  assert:
    - type: regex
      value: ".*renard.*"

- vars:
    language: Spanish
    input: The quick brown fox jumps over the lazy dog
  assert:
    - type: regex
      value: ".*zorro.*"

- vars:
    language: French
    input: "Error: file not found at /usr/local/bin"
  assert:
    - type: regex
      value: "/usr/local/bin"

- vars:
    language: Spanish
    input: "Error: file not found at /usr/local/bin"
  assert:
    - type: regex
      value: "/usr/local/bin"

- vars:
    language: French
    input: "Price: $1,234.56 USD — tax included"
  assert:
    - type: regex
      value: '\$1,234\.56|1[.\s\u00a0\u202f]?234,56'

- vars:
    language: French
    input: Please contact support@example.com or call +1-800-555-0199
  assert:
    - type: regex
      value: 'support@example.com|\+1-800-555-0199'

- vars:
    language: Spanish
    input: Please contact support@example.com or call +1-800-555-0199
  assert:
    - type: regex
      value: 'support@example.com|\+1-800-555-0199'

- vars:
    language: French
    input: Can you help me?
  assert:
    - type: not-icontains-any
      value: ["error", "erreur"]

- vars:
    language: Spanish
    input: Can you help me?
  assert:
    - type: not-icontains-any
      value: ["error"]

- vars:
    language: French
    input: 1+1 = 2
  assert:
    - type: regex
      value: '1\+1.*2|1\s*\+\s*1.*2'
