name: Evals

# Runs both suites on a small model on the runner's CPU and fails when a score falls below the
# committed baseline in baselines/. Runs only when something that can change a score changes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'prompts/**'
      - 'tests/**'
      - 'ci/**'
      - 'scripts/**'
      - 'baselines/**'
      - 'promptfooconfig*.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eval.yml'
  push:
    branches: [main]
    paths:
      - 'prompts/**'
      - 'tests/**'
      - 'ci/**'
      - 'scripts/**'
      - 'baselines/**'
      - 'promptfooconfig*.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eval.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_MODEL: qwen3:1.7b
  OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models
  PROMPTFOO_DISABLE_TELEMETRY: '1'
  PROMPTFOO_DISABLE_UPDATE: '1'
  # Failing tests are expected on a small model; the baseline check decides pass or fail.
  PROMPTFOO_FAILED_TEST_EXIT_CODE: '0'
  # Fail a stuck request after 3 minutes instead of the default 5, and the whole run after 30.
  REQUEST_TIMEOUT_MS: '180000'
  PROMPTFOO_EVAL_TIMEOUT_MS: '1800000'

jobs:
  eval:
    name: Eval (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The translation suite is split by prompt into three parallel jobs, since a CPU-bound run is slow.
      matrix:
        include:
          - { name: translation-direct, suite: translation, prompts: '^Direct \(default\):' }
          - { name: translation-detailed, suite: translation, prompts: '^Detailed:' }
          - { name: translation-code-aware, suite: translation, prompts: '^Code-Aware:' }
          - { name: test-design, suite: test-design, prompts: '.' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: .ollama/models
          key: ollama-${{ env.CI_MODEL }}

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service with its own model directory; run our own
          # server instead so the cached models are used.
          sudo systemctl stop ollama || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama --version
          ollama pull "$CI_MODEL"

      - name: Run ${{ matrix.name }}
        run: >-
          npx promptfoo eval -c ci/promptfooconfig.${{ matrix.suite }}.yaml
          --filter-prompts '${{ matrix.prompts }}'
          -o outputs/ci/${{ matrix.name }}.json --no-table --no-share --no-progress-bar

      - name: Compare with the baseline
        run: node scripts/baseline.js check outputs/ci/${{ matrix.name }}.json baselines/ci-${{ matrix.name }}.json

      - name: Show the Ollama log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/ollama.log" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.name }}
          path: outputs/ci/
          if-no-files-found: ignore
